aid: method-security
name: Method Security
description: >-
  Method Security is a cybersecurity company delivering cyber resilience to the
  U.S. Government and critical enterprises through an AI-native, full-spectrum
  security platform. The Method Platform blends offensive and defensive
  operations across cloud, on-premise, and internet-denied environments, and
  ships two flagship products: Bastion (digital-twin driven exposure and
  attack-surface management that maps, validates, and controls resources and
  attack paths) and Reaper/Operations (software-defined offensive operations and
  red-team execution). The platform is built around an Ontology object model,
  AI Agents governed by granular Policies, Jackal C2 agents, Overwatch terminal
  session recording, and an Explorer/Automator workspace. Method exposes a public
  REST API (OpenAPI 3.1) through the method-api-gateway, a published Python SDK
  (methodsdk), a docs MCP server, and OAuth 2.0 client-credentials authentication
  backed by Keycloak. Backed by OpenAI, Palantir, Andreessen Horowitz, General
  Catalyst, and Blackstone.
