openapi: 3.1.0
info:
  title: API Reference audit auth API
  version: 1.0.0
tags:
- name: auth
paths:
  /method-api-gateway/api/auth/getToken:
    post:
      operationId: getTokenWithClientCredentials
      summary: Get Token With Client Credentials
      tags:
      - auth
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_auth:TokenResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                scope:
                  type: string
              required:
              - client_id
              - client_secret
              - grant_type
components:
  schemas:
    type_auth:TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
      required:
      - access_token
      - expires_in
      description: An OAuth token response from Keycloak.
      title: TokenResponse
  securitySchemes:
    client-credentials:
      type: http
      scheme: bearer
