openapi: 3.1.0
info:
  title: API Reference
  version: 1.0.0
paths:
  /method-api-gateway/api/auth/getToken:
    post:
      operationId: getTokenWithClientCredentials
      summary: Get Token With Client Credentials
      tags:
        - auth
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_auth:TokenResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                scope:
                  type: string
              required:
                - client_id
                - client_secret
                - grant_type
  /method-api-gateway/api/v1/audit/getAuditEvents:
    post:
      operationId: getAuditEvents
      summary: Get Audit Events
      description: Retrieves all audit events in the specified time range
      tags:
        - audit
      parameters:
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: token
          in: query
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/audit:AuditEventsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1/audit:GetAuditEventsRequest'
  /method-api-gateway/api/v1/blueprints/:
    get:
      operationId: listBlueprints
      summary: List Blueprints
      description: List available Method blueprints and their parameter definitions.
      tags:
        - blueprints
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/blueprints:ListBlueprintsResponse'
  /method-api-gateway/api/v1/blueprints/{blueprintId}/run:
    post:
      operationId: runBlueprint
      summary: Run Blueprint
      description: Run a blueprint in an environment.
      tags:
        - blueprints
      parameters:
        - name: blueprintId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_v1/blueprints:BlueprintId'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/blueprints:RunBlueprintResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1/blueprints:RunBlueprintRequest'
  /method-api-gateway/api/v1/environments/:
    post:
      operationId: createEnvironment
      summary: Create Environment
      description: Create a new Method environment.
      tags:
        - environments
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/environments:CreateEnvironmentResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1/environments:CreateEnvironmentRequest'
  /method-api-gateway/api/v1/environments/{environmentId}/intel:
    post:
      operationId: uploadEnvironmentIntel
      summary: Upload Environment Intel
      description: Upload an intelligence attachment and associate it with an environment.
      tags:
        - environments
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_common:EnvironmentId'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/environments:UploadEnvironmentIntelResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1/environments:UploadEnvironmentIntelRequest'
  /method-api-gateway/api/v1/issues/{id}:
    get:
      operationId: getIssue
      summary: Get Issue
      description: Retrieve an issue from Method using its ID
      tags:
        - issues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_v1/issues:IssueId'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/issues:Issue'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/issues:IssueId'
  /method-api-gateway/api/v1/issues/{id}/update:
    post:
      operationId: updateIssue
      summary: Update Issue
      description: |-
        Update an issue's workflow fields. All provided fields are updated atomically.
        Only include fields you want to change - omitted fields remain unchanged.
        When closing an issue, you must provide a closeReason.
      tags:
        - issues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_v1/issues:IssueId'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/issues:Issue'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/issues:IssueId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1/issues:UpdateIssueRequest'
  /method-api-gateway/api/v1/reports/{reportId}:
    get:
      operationId: getReport
      summary: Get Report
      description: Retrieve a report document as markdown.
      tags:
        - reports
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_v1/reports:ReportId'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/reports:Report'
  /method-api-gateway/api/v1/signals/{signalId}/content:
    get:
      operationId: getSignalContentServer
      summary: Get Signal Content Server
      description: Retrieve the raw content for a signal using its ID.
      tags:
        - signals
      parameters:
        - name: signalId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_v1/signals:SignalId'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                description: Any type
  /method-api-gateway/api/v1/skills/search:
    post:
      operationId: searchSkills
      summary: Search Skills
      description: Search the skills available to agents.
      tags:
        - skills
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/skills:SearchSkillsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1/skills:SearchSkillsRequest'
  /method-api-gateway/api/v1/skills/{skillId}:
    get:
      operationId: getSkill
      summary: Get Skill
      description: Retrieve a skill, including its markdown content.
      tags:
        - skills
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_v1/skills:SkillId'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/skills:Skill'
    put:
      operationId: updateSkill
      summary: Update Skill
      description: Update an existing skill's content, metadata, and labels.
      tags:
        - skills
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_v1/skills:SkillId'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/skills:Skill'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1/skills:UpdateSkillRequest'
  /method-api-gateway/api/v1/skills/:
    post:
      operationId: createSkill
      summary: Create Skill
      description: Create a skill from markdown content.
      tags:
        - skills
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/skills:Skill'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1/skills:CreateSkillRequest'
  /method-api-gateway/api/v1/system/externalIp:
    get:
      operationId: getExternalIPAddresses
      summary: Get External IP Addresses
      description: Retrieves the source IP addresses for scans from the Method platform
      tags:
        - system
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/system:ExternalIPAddresses'
  /method-api-gateway/api/v1/targets/search:
    post:
      operationId: searchTargets
      summary: Search Targets
      description: Search targeting runs with an optional filter.
      tags:
        - targets
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/targets:SearchTargetsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1/targets:SearchTargetsRequest'
  /method-api-gateway/api/v1/targets/{targetId}:
    get:
      operationId: getTarget
      summary: Get Target
      description: Retrieve a targeting run by ID.
      tags:
        - targets
      parameters:
        - name: targetId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_v1/targets:TargetId'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/targets:Target'
  /method-api-gateway/api/v1/targets/{targetId}/reports:
    get:
      operationId: getTargetReports
      summary: Get Target Reports
      description: Retrieve reports linked to a targeting run.
      tags:
        - targets
      parameters:
        - name: targetId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_v1/targets:TargetId'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1/targets:GetTargetReportsResponse'
components:
  schemas:
    type_auth:TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
      required:
        - access_token
        - expires_in
      description: An OAuth token response from Keycloak.
      title: TokenResponse
    type_v1/audit:GetAuditEventsRequest:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
      required:
        - startTime
        - endTime
      title: GetAuditEventsRequest
    type_v1/audit:AuditEventId:
      type: string
      description: The unique identifier for an audit event in Method
      title: AuditEventId
    type_v1/audit:TenantId:
      type: string
      description: The unique identifier of the tenant for which the audit event was emitted
      title: TenantId
    type_v1/audit:UserId:
      type: string
      description: The unique identifier of a human user in Method
      title: UserId
    type_v1/audit:ExternalUserId:
      type: string
      description: The identifier of a user in Method according to an external auth provider
      title: ExternalUserId
    type_v1/audit:ServiceAccountId:
      type: string
      description: The unique identifier of a service account in Method
      title: ServiceAccountId
    type_v1/audit:Actor:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - user
              description: 'Discriminator value: user'
            id:
              $ref: '#/components/schemas/type_v1/audit:UserId'
            name:
              type: string
            email:
              type: string
            externalId:
              $ref: '#/components/schemas/type_v1/audit:ExternalUserId'
          required:
            - type
            - id
            - name
        - type: object
          properties:
            type:
              type: string
              enum:
                - serviceAccount
              description: 'Discriminator value: serviceAccount'
            id:
              $ref: '#/components/schemas/type_v1/audit:ServiceAccountId'
          required:
            - type
            - id
      discriminator:
        propertyName: type
      title: Actor
    type_v1/audit:PlatformActionOperation:
      type: string
      enum:
        - CREATE
        - UPDATE
        - DELETE
        - LOAD
        - QUERY
        - DECRYPT
      title: PlatformActionOperation
    type_v1/audit:ResourceKind:
      type: string
      enum:
        - AGENT
        - ENVIRONMENT
        - GROUP
        - ISSUE
        - ISSUE_DEFINITION
        - JACKAL
        - MODEL
        - MODEL_PROVIDER
        - OAUTH_CLIENT
        - OBJECT_SET
        - ONTOLOGY_OBJECT
        - OPERATOR_SESSION
        - REPORT
        - SENSITIVE_VALUE
        - SKILL
        - TASK
        - TASK_RUN
        - TOKEN
        - TOOL
        - USER_ACCOUNT
      title: ResourceKind
    type_v1/audit:Action:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - userLogin
              description: 'Discriminator value: userLogin'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - userLogout
              description: 'Discriminator value: userLogout'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - userAccountCreation
              description: 'Discriminator value: userAccountCreation'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - userAccountModification
              description: 'Discriminator value: userAccountModification'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - userAccountDeletion
              description: 'Discriminator value: userAccountDeletion'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - auditLogAccess
              description: 'Discriminator value: auditLogAccess'
            pageSize:
              type: integer
            since:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - load
              description: 'Discriminator value: load'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - platformAction
              description: 'Discriminator value: platformAction'
            operation:
              $ref: '#/components/schemas/type_v1/audit:PlatformActionOperation'
            resourceKind:
              $ref: '#/components/schemas/type_v1/audit:ResourceKind'
          required:
            - type
            - operation
      discriminator:
        propertyName: type
      title: Action
    type_v1/audit:User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/type_v1/audit:UserId'
        name:
          type: string
        email:
          type: string
        externalId:
          $ref: '#/components/schemas/type_v1/audit:ExternalUserId'
      required:
        - id
        - name
      title: User
    type_v1/audit:GroupId:
      type: string
      description: The unique identifier of a user group in Method
      title: GroupId
    type_v1/issues:IssueId:
      type: string
      description: The unique identifier for an issue in Method
      title: IssueId
    type_v1/objects:ObjectId:
      type: string
      description: The unique identifier for an object in Method
      title: ObjectId
    type_v1/audit:PlatformResourceId:
      type: string
      description: The unique identifier for a Method platform resource.
      title: PlatformResourceId
    type_v1/audit:Resource:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - userAccount
              description: 'Discriminator value: userAccount'
            user:
              $ref: '#/components/schemas/type_v1/audit:User'
          required:
            - type
            - user
        - type: object
          properties:
            type:
              type: string
              enum:
                - group
              description: 'Discriminator value: group'
            id:
              $ref: '#/components/schemas/type_v1/audit:GroupId'
            name:
              type: string
          required:
            - type
            - id
            - name
        - type: object
          properties:
            type:
              type: string
              enum:
                - issue
              description: 'Discriminator value: issue'
            id:
              $ref: '#/components/schemas/type_v1/issues:IssueId'
          required:
            - type
            - id
        - type: object
          properties:
            type:
              type: string
              enum:
                - ontologyObject
              description: 'Discriminator value: ontologyObject'
            id:
              $ref: '#/components/schemas/type_v1/objects:ObjectId'
          required:
            - type
            - id
        - type: object
          properties:
            type:
              type: string
              enum:
                - platformResource
              description: 'Discriminator value: platformResource'
            kind:
              $ref: '#/components/schemas/type_v1/audit:ResourceKind'
            id:
              $ref: '#/components/schemas/type_v1/audit:PlatformResourceId'
          required:
            - type
            - kind
            - id
      discriminator:
        propertyName: type
      title: Resource
    type_v1/audit:IpAddress:
      type: string
      description: The source IP for a request made to the Method platform
      title: IpAddress
    type_v1/audit:UserAgent:
      type: string
      description: The user agent for a request made to the Method platform
      title: UserAgent
    type_v1/audit:Context:
      type: object
      properties:
        sourceIp:
          $ref: '#/components/schemas/type_v1/audit:IpAddress'
        userAgent:
          $ref: '#/components/schemas/type_v1/audit:UserAgent'
      title: Context
    type_v1/audit:AuditEventStatus:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - success
              description: 'Discriminator value: success'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - failure
              description: 'Discriminator value: failure'
            message:
              type: string
          required:
            - type
      discriminator:
        propertyName: type
      title: AuditEventStatus
    type_v1/audit:AuditEvent:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/type_v1/audit:AuditEventId'
        tenantId:
          $ref: '#/components/schemas/type_v1/audit:TenantId'
        timestamp:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/type_v1/audit:Actor'
        action:
          $ref: '#/components/schemas/type_v1/audit:Action'
        resource:
          $ref: '#/components/schemas/type_v1/audit:Resource'
        context:
          $ref: '#/components/schemas/type_v1/audit:Context'
        status:
          $ref: '#/components/schemas/type_v1/audit:AuditEventStatus'
      required:
        - id
        - tenantId
        - timestamp
        - actor
        - action
        - context
        - status
      title: AuditEvent
    type_v1/audit:AuditEventsResponse:
      type: object
      properties:
        auditEvents:
          type: array
          items:
            $ref: '#/components/schemas/type_v1/audit:AuditEvent'
        pagingToken:
          type: string
      required:
        - auditEvents
      title: AuditEventsResponse
    type_v1/blueprints:BlueprintId:
      type: string
      description: The unique identifier for a Method blueprint.
      title: BlueprintId
    type_v1/blueprints:ParameterKey:
      type: string
      description: A blueprint parameter key.
      title: ParameterKey
    type_v1/blueprints:ParameterDefinition:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/type_v1/blueprints:ParameterKey'
        displayName:
          type: string
        description:
          type: string
        type:
          description: Blueprint parameter field type.
        requirements:
          type: array
          items:
            description: Any type
          description: Validation requirements for this parameter.
        defaultValue:
          description: Default value, if one exists.
      required:
        - key
        - displayName
        - description
        - type
        - requirements
      description: Blueprint parameter metadata.
      title: ParameterDefinition
    type_v1/blueprints:ObjectTypeApiName:
      type: string
      description: The API name of an ontology object type.
      title: ObjectTypeApiName
    type_v1/blueprints:Blueprint:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/type_v1/blueprints:BlueprintId'
        displayName:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/type_v1/blueprints:ParameterDefinition'
        objectTypesCreated:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/type_v1/blueprints:ObjectTypeApiName'
      required:
        - id
        - displayName
        - description
        - parameters
        - objectTypesCreated
      title: Blueprint
    type_v1/blueprints:ListBlueprintsResponse:
      type: object
      properties:
        blueprints:
          type: array
          items:
            $ref: '#/components/schemas/type_v1/blueprints:Blueprint'
      required:
        - blueprints
      title: ListBlueprintsResponse
    type_common:EnvironmentId:
      type: string
      description: The unique identifier for an environment in Method
      title: EnvironmentId
    type_v1/blueprints:ParameterValue:
      type: object
      properties:
        type:
          description: Parameter value type, such as scalar, collection, or ontology.
        value:
          description: Parameter value payload.
      required:
        - type
        - value
