openapi: 3.1.0
info:
  title: API Reference
  version: 1.0.0
paths:
  /method-api-gateway/api/auth/getToken:
    post:
      operationId: auth_getTokenWithClientCredentials
      summary: Get Token With Client Credentials
      tags:
        - auth
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth_TokenResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                scope:
                  type: string
              required:
                - client_id
                - client_secret
                - grant_type
  /method-api-gateway/api/v1/audit/getAuditEvents:
    post:
      operationId: audit_getAuditEvents
      summary: Get Audit Events
      description: Retrieves all audit events in the specified time range
      tags:
        - audit
      parameters:
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_audit_AuditEventsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_audit_GetAuditEventsRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/blueprints/:
    get:
      operationId: blueprints_listBlueprints
      summary: List Blueprints
      description: List available Method blueprints and their parameter definitions.
      tags:
        - blueprints
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_blueprints_ListBlueprintsResponse'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/blueprints/{blueprintId}/run:
    post:
      operationId: blueprints_runBlueprint
      summary: Run Blueprint
      description: Run a blueprint in an environment.
      tags:
        - blueprints
      parameters:
        - name: blueprintId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/v1_blueprints_BlueprintId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_blueprints_RunBlueprintResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_blueprints_RunBlueprintRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/environments/{environmentId}:
    get:
      operationId: environments_getEnvironment
      summary: Get Environment
      description: Retrieve an environment from Method using its ID.
      tags:
        - environments
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/common_EnvironmentId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_environments_Environment'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/environments/{environmentId}/tag-hierarchy:
    get:
      operationId: environments_getEnvironmentTagHierarchy
      summary: Get Environment Tag Hierarchy
      description: Retrieve the ordered environment tag hierarchy paths containing an environment.
      tags:
        - environments
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/common_EnvironmentId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/v1_tags_Tag'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/environments/:
    post:
      operationId: environments_createEnvironment
      summary: Create Environment
      description: Create a new Method environment.
      tags:
        - environments
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_environments_CreateEnvironmentResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_environments_CreateEnvironmentRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/environments/{environmentId}/intel:
    post:
      operationId: environments_uploadEnvironmentIntel
      summary: Upload Environment Intel
      description: Upload an intelligence attachment and associate it with an environment.
      tags:
        - environments
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/common_EnvironmentId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_environments_UploadEnvironmentIntelResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_environments_UploadEnvironmentIntelRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/environments/search:
    post:
      operationId: environments_searchEnvironments
      summary: Search Environments
      description: |-
        Search environments. Omit filter to return all.
        tags matches environments that have any of the given tag ids.
      tags:
        - environments
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_environments_SearchEnvironmentsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_environments_SearchEnvironmentsRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/issues/{id}:
    get:
      operationId: issues_getIssue
      summary: Get Issue
      description: Retrieve an issue from Method using its ID
      tags:
        - issues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/v1_issues_IssueId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_issues_Issue'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_issues_IssueId'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/reports/{reportId}:
    get:
      operationId: reports_getReport
      summary: Get Report
      description: Retrieve a report document as markdown.
      tags:
        - reports
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/v1_reports_ReportId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_reports_Report'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/signals/{signalId}/content:
    get:
      operationId: signals_getSignalContentServer
      summary: Get Signal Content Server
      description: Retrieve the raw content for a signal using its ID.
      tags:
        - signals
      parameters:
        - name: signalId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/v1_signals_SignalId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                description: Any type
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/skills/search:
    post:
      operationId: skills_searchSkills
      summary: Search Skills
      description: Search the skills available to agents.
      tags:
        - skills
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_skills_SearchSkillsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_skills_SearchSkillsRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/skills/{skillId}:
    get:
      operationId: skills_getSkill
      summary: Get Skill
      description: Retrieve a skill, including its markdown content.
      tags:
        - skills
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/v1_skills_SkillId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_skills_Skill'
      security:
        - client-credentials: []
    put:
      operationId: skills_updateSkill
      summary: Update Skill
      description: Update an existing skill's content, metadata, and labels.
      tags:
        - skills
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/v1_skills_SkillId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_skills_Skill'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_skills_UpdateSkillRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/skills/:
    post:
      operationId: skills_createSkill
      summary: Create Skill
      description: Create a skill from markdown content.
      tags:
        - skills
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_skills_Skill'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_skills_CreateSkillRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v1/system/externalIp:
    get:
      operationId: system_getExternalIPAddresses
      summary: Get External IP Addresses
      description: Retrieves the source IP addresses for scans from the Method platform
      tags:
        - system
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_system_ExternalIPAddresses'
      security:
        - client-credentials: []
  /method-api-gateway/api/v2/finding-definitions/{findingDefinitionId}:
    get:
      operationId: findingDefinitions_getFindingDefinition
      summary: Get Finding Definition
      description: Retrieve a finding definition by ID.
      tags:
        - finding_definitions
      parameters:
        - name: findingDefinitionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/common_FindingDefinitionId'
        - name: environmentId
          in: query
          description: When set, return the definition as it applies in this environment.
          required: false
          schema:
            $ref: '#/components/schemas/common_EnvironmentId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_findingDefinitions_FindingDefinition'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_FindingDefinitionId'
      security:
        - client-credentials: []
  /method-api-gateway/api/v2/finding-definitions/search:
    post:
      operationId: findingDefinitions_searchFindingDefinitions
      summary: Search Finding Definitions
      description: Search finding definitions.
      tags:
        - finding_definitions
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_findingDefinitions_SearchFindingDefinitionsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2_findingDefinitions_SearchFindingDefinitionsRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v2/finding-definitions/{findingDefinitionId}/severity:
    post:
      operationId: findingDefinitions_updateFindingDefinitionSeverity
      summary: Update Finding Definition Severity
      description: Update the default severity of a finding definition.
      tags:
        - finding_definitions
      parameters:
        - name: findingDefinitionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/common_FindingDefinitionId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_findingDefinitions_FindingDefinition'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_FindingDefinitionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2_findingDefinitions_UpdateFindingDefinitionSeverityRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v2/findings/{findingId}:
    get:
      operationId: findings_getFinding
      summary: Get Finding
      description: Retrieve a finding by ID.
      tags:
        - findings
      parameters:
        - name: findingId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/common_FindingId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_findings_Finding'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_FindingId'
      security:
        - client-credentials: []
  /method-api-gateway/api/v2/findings/{findingId}/update:
    post:
      operationId: findings_updateFinding
      summary: Update Finding
      description: Update a finding. Omitted fields are unchanged. closeReason is required when status is CLOSED.
      tags:
        - findings
      parameters:
        - name: findingId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/common_FindingId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_findings_Finding'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_FindingId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2_findings_UpdateFindingRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v2/targets/search:
    post:
      operationId: targets_searchTargets
      summary: Search Targets
      description: Search targeting runs with an optional filter.
      tags:
        - targets
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_targets_SearchTargetsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2_targets_SearchTargetsRequest'
      security:
        - client-credentials: []
  /method-api-gateway/api/v2/targets/{targetId}:
    get:
      operationId: targets_getTarget
      summary: Get Target
      description: Retrieve a targeting run by ID.
      tags:
        - targets
      parameters:
        - name: targetId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/common_TargetId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_targets_Target'
      security:
        - client-credentials: []
  /method-api-gateway/api/v2/targets/{targetId}/reports:
    get:
      operationId: targets_getTargetReports
      summary: Get Target Reports
      description: Retrieve reports linked to a targeting run.
      tags:
        - targets
      parameters:
        - name: targetId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/common_TargetId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_targets_GetTargetReportsResponse'
      security:
        - client-credentials: []
  /method-api-gateway/api/v2/targets/{targetId}/findings:
    get:
      operationId: targets_getTargetFindings
      summary: Get Target Findings
      description: Retrieve finding IDs linked to this targeting run.
      tags:
        - targets
      parameters:
        - name: targetId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/common_TargetId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_targets_GetTargetFindingsResponse'
      security:
        - client-credentials: []
tags:
  - name: auth
  - name: audit
  - name: blueprints
  - name: environments
  - name: issues
  - name: reports
  - name: signals
  - name: skills
  - name: system
  - name: finding_definitions
  - name: findings
  - name: targets
components:
  schemas:
    auth_TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
      required:
        - access_token
        - expires_in
      description: An OAuth token response from Keycloak.
      title: TokenResponse
    v1_audit_GetAuditEventsRequest:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
      required:
        - startTime
        - endTime
      title: GetAuditEventsRequest
    v1_audit_AuditEventId:
      type: string
      description: The unique identifier for an audit event in Method
      title: AuditEventId
    v1_audit_TenantId:
      type: string
      description: The unique identifier of the tenant for which the audit event was emitted
      title: TenantId
    v1_audit_UserId:
      type: string
      description: The unique identifier of a human user in Method
      title: UserId
    v1_audit_ExternalUserId:
      type: string
      description: The identifier of a user in Method according to an external auth provider
      title: ExternalUserId
    v1_audit_ServiceAccountId:
      type: string
      description: The unique identifier of a service account in Method
      title: ServiceAccountId
    v1_audit_OauthApplicationId:
      type: string
      description: The unique identifier of an OAuth application in Method
      title: OauthApplicationId
    v1_audit_ClientId:
      type: string
      description: The OAuth client identifier for an OAuth application
      title: ClientId
    v1_audit_AgentRunPrincipal:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - user
              description: 'Discriminator value: user'
            id:
              $ref: '#/components/schemas/v1_audit_UserId'
            name:
              type: string
            email:
              type: string
            externalId:
              $ref: '#/components/schemas/v1_audit_ExternalUserId'
          required:
            - type
            - id
            - name
        - type: object
          properties:
            type:
              type: string
              enum:
                - serviceAccount
              description: 'Discriminator value: serviceAccount'
            id:
              $ref: '#/components/schemas/v1_audit_ServiceAccountId'
          required:
            - type
            - id
        - type: object
          properties:
            type:
              type: string
              enum:
                - oauthApplication
              description: 'Discriminator value: oauthApplication'
            id:
              $ref: '#/components/schemas/v1_audit_OauthApplicationId'
            clientId:
              $ref: '#/components/schemas/v1_audit_ClientId'
          required:
            - type
            - id
            - clientId
      discriminator:
        propertyName: type
      description: |-
        The principal on whose behalf an agent run acts. This excludes agent runs so that an agent run cannot be
        nested inside another agent run.
      title: AgentRunPrincipal
    v1_audit_AgentSessionId:
      type: string
      description: The unique identifier of an agent session in Method
      title: AgentSessionId
    v1_audit_Actor:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - user
              description: 'Discriminator value: user'
            id:
              $ref: '#/components/schemas/v1_audit_UserId'
            name:
              type: string
            email:
              type: string
            externalId:
              $ref: '#/components/schemas/v1_audit_ExternalUserId'
          required:
            - type
            - id
            - name
        - type: object
          properties:
            type:
              type: string
              enum:
                - serviceAccount
              description: 'Discriminator value: serviceAccount'
            id:
              $ref: '#/components/schemas/v1_audit_ServiceAccountId'
          required:
            - type
            - id
        - type: object
          properties:
            type:
              type: string
              enum:
                - oauthApplication
              description: 'Discriminator value: oauthApplication'
            id:
              $ref: '#/components/schemas/v1_audit_OauthApplicationId'
            clientId:
              $ref: '#/components/schemas/v1_audit_ClientId'
          required:
            - type
            - id
            - clientId
        - type: object
          properties:
            type:
              type: string
              enum:
                - agentRun
              description: 'Discriminator value: agentRun'
            principal:
              $ref: '#/components/schemas/v1_audit_AgentRunPrincipal'
            agentSessionId:
              $ref: '#/components/schemas/v1_audit_AgentSessionId'
          required:
            - type
            - principal
            - agentSessionId
      discriminator:
        propertyName: type
      title: Actor
    v1_objects_ObjectSetId:
      type: string
      description: The unique identifier for an object set in Method
      title: ObjectSetId
    v1_audit_PlatformActionOperation:
      type: string
      enum:
        - APPROVE
        - CREATE
        - UPDATE
        - DELETE
        - LOAD
        - LAUNCH
        - QUERY
        - DECRYPT
      title: PlatformActionOperation
    v1_audit_ResourceKind:
      type: string
      enum:
        - AGENT
        - AGENT_SESSION
        - ENVIRONMENT
        - GROUP
        - ISSUE
        - ISSUE_DEFINITION
        - JACKAL
        - MODEL
        - MODEL_PROVIDER
        - OAUTH_CLIENT
        - OBJECT_SET
        - ONTOLOGY_OBJECT
        - OPERATOR_SESSION
        - REPORT
        - SCIM_INTEGRATION
        - SENSITIVE_VALUE
        - SKILL
        - TARGET
        - TARGET_PACKAGE
        - TASK
        - TASK_RUN
        - TOKEN
        - TOOL
        - USER_ACCOUNT
      title: ResourceKind
    v1_audit_Action:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - userLogin
              description: 'Discriminator value: userLogin'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - userLogout
              description: 'Discriminator value: userLogout'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - userAccountCreation
              description: 'Discriminator value: userAccountCreation'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - userAccountModification
              description: 'Discriminator value: userAccountModification'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - userAccountDeletion
              description: 'Discriminator value: userAccountDeletion'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - auditLogAccess
              description: 'Discriminator value: auditLogAccess'
            pageSize:
              type: integer
            since:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - groupMembershipAddition
              description: 'Discriminator value: groupMembershipAddition'
            userIds:
              type: array
              items:
                $ref: '#/components/schemas/v1_audit_UserId'
          required:
            - type
            - userIds
        - type: object
          properties:
            type:
              type: string
              enum:
                - groupMembershipRemoval
              description: 'Discriminator value: groupMembershipRemoval'
            userIds:
