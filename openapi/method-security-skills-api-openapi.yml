openapi: 3.2.0
info:
  title: Reference Skills API
  version: 1.0.0
tags:
- name: Skills
paths:
  /method-api-gateway/api/v1/skills/search:
    post:
      operationId: skills_searchSkills
      summary: Search Skills
      description: Search the skills available to agents.
      tags:
      - Skills
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_skills_SearchSkillsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_skills_SearchSkillsRequest'
      security:
      - client-credentials: []
  /method-api-gateway/api/v1/skills/{skillId}:
    get:
      operationId: skills_getSkill
      summary: Get Skill
      description: Retrieve a skill, including its markdown content.
      tags:
      - Skills
      parameters:
      - name: skillId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/v1_skills_SkillId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_skills_Skill'
      security:
      - client-credentials: []
    put:
      operationId: skills_updateSkill
      summary: Update Skill
      description: Update an existing skill's content, metadata, and labels.
      tags:
      - Skills
      parameters:
      - name: skillId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/v1_skills_SkillId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_skills_Skill'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_skills_UpdateSkillRequest'
      security:
      - client-credentials: []
  /method-api-gateway/api/v1/skills/:
    post:
      operationId: skills_createSkill
      summary: Create Skill
      description: Create a skill from markdown content.
      tags:
      - Skills
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_skills_Skill'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1_skills_CreateSkillRequest'
      security:
      - client-credentials: []
components:
  schemas:
    v1_skills_CreateSkillRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        content:
          type: string
          description: The skill body as markdown.
        labels:
          type: array
          items:
            type: string
          description: Free-form labels to attach to the skill.
      required:
      - name
      - content
      title: CreateSkillRequest
    v1_skills_SkillId:
      type: string
      description: The unique identifier for a skill.
      title: SkillId
    v1_skills_SearchSkillsResponse:
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/v1_skills_Skill'
        pagingToken:
          type: string
      required:
      - skills
      title: SearchSkillsResponse
    v1_skills_Skill:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/v1_skills_SkillId'
        name:
          type: string
        description:
          type: string
        content:
          type: string
          description: The skill body as markdown.
        labels:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Free-form labels used to organize and discover the skill.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - content
      - labels
      - createdAt
      - updatedAt
      title: Skill
    v1_skills_SearchSkillsRequest:
      type: object
      properties:
        nameLike:
          type: string
        pageSize:
          type: integer
        pagingToken:
          type: string
      title: SearchSkillsRequest
    v1_skills_UpdateSkillRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        content:
          type: string
          description: The skill body as markdown.
        labels:
          type: array
          items:
            type: string
          description: Replaces the skill's labels. Omit to leave the existing labels unchanged; pass an empty list to clear them.
      required:
      - name
      - content
      title: UpdateSkillRequest
  securitySchemes:
    client-credentials:
      type: http
      scheme: bearer
