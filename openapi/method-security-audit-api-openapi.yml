openapi: 3.2.0
info:
  title: Reference Audit API
  version: 1.0.0
tags:
- name: Audit
paths:
  /method-api-gateway/api/v1/audit/getAuditEvents:
    post:
      operationId: getAuditEvents
      summary: Get Audit Events
      description: Retrieves all audit events in the specified time range
      tags:
      - Audit
      parameters:
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
      - name: token
        in: query
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1_audit_AuditEventsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1_audit_GetAuditEventsRequest'
components:
  schemas:
    type_v1_audit_ResourceKind:
      type: string
      enum:
      - AGENT
      - ENVIRONMENT
      - GROUP
      - ISSUE
      - ISSUE_DEFINITION
      - JACKAL
      - MODEL
      - MODEL_PROVIDER
      - OAUTH_CLIENT
      - OBJECT_SET
      - ONTOLOGY_OBJECT
      - OPERATOR_SESSION
      - REPORT
      - SENSITIVE_VALUE
      - SKILL
      - TASK
      - TASK_RUN
      - TOKEN
      - TOOL
      - USER_ACCOUNT
      title: ResourceKind
    type_v1_audit_Resource:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - userAccount
            description: 'Discriminator value: userAccount'
          user:
            $ref: '#/components/schemas/type_v1_audit_User'
        required:
        - type
        - user
      - type: object
        properties:
          type:
            type: string
            enum:
            - group
            description: 'Discriminator value: group'
          id:
            $ref: '#/components/schemas/type_v1_audit_GroupId'
          name:
            type: string
        required:
        - type
        - id
        - name
      - type: object
        properties:
          type:
            type: string
            enum:
            - issue
            description: 'Discriminator value: issue'
          id:
            $ref: '#/components/schemas/type_v1_issues_IssueId'
        required:
        - type
        - id
      - type: object
        properties:
          type:
            type: string
            enum:
            - ontologyObject
            description: 'Discriminator value: ontologyObject'
          id:
            $ref: '#/components/schemas/type_v1_objects_ObjectId'
        required:
        - type
        - id
      - type: object
        properties:
          type:
            type: string
            enum:
            - platformResource
            description: 'Discriminator value: platformResource'
          kind:
            $ref: '#/components/schemas/type_v1_audit_ResourceKind'
          id:
            $ref: '#/components/schemas/type_v1_audit_PlatformResourceId'
        required:
        - type
        - kind
        - id
      discriminator:
        propertyName: type
      title: Resource
    type_v1_audit_PlatformResourceId:
      type: string
      description: The unique identifier for a Method platform resource.
      title: PlatformResourceId
    type_v1_audit_IpAddress:
      type: string
      description: The source IP for a request made to the Method platform
      title: IpAddress
    type_v1_audit_UserId:
      type: string
      description: The unique identifier of a human user in Method
      title: UserId
    type_v1_audit_Context:
      type: object
      properties:
        sourceIp:
          $ref: '#/components/schemas/type_v1_audit_IpAddress'
        userAgent:
          $ref: '#/components/schemas/type_v1_audit_UserAgent'
      title: Context
    type_v1_audit_ServiceAccountId:
      type: string
      description: The unique identifier of a service account in Method
      title: ServiceAccountId
    type_v1_objects_ObjectId:
      type: string
      description: The unique identifier for an object in Method
      title: ObjectId
    type_v1_audit_Actor:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - user
            description: 'Discriminator value: user'
          id:
            $ref: '#/components/schemas/type_v1_audit_UserId'
          name:
            type: string
          email:
            type: string
          externalId:
            $ref: '#/components/schemas/type_v1_audit_ExternalUserId'
        required:
        - type
        - id
        - name
      - type: object
        properties:
          type:
            type: string
            enum:
            - serviceAccount
            description: 'Discriminator value: serviceAccount'
          id:
            $ref: '#/components/schemas/type_v1_audit_ServiceAccountId'
        required:
        - type
        - id
      discriminator:
        propertyName: type
      title: Actor
    type_v1_audit_Action:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - userLogin
            description: 'Discriminator value: userLogin'
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - userLogout
            description: 'Discriminator value: userLogout'
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - userAccountCreation
            description: 'Discriminator value: userAccountCreation'
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - userAccountModification
            description: 'Discriminator value: userAccountModification'
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - userAccountDeletion
            description: 'Discriminator value: userAccountDeletion'
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - auditLogAccess
            description: 'Discriminator value: auditLogAccess'
          pageSize:
            type: integer
          since:
            type: string
            format: date-time
          until:
            type: string
            format: date-time
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - load
            description: 'Discriminator value: load'
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - platformAction
            description: 'Discriminator value: platformAction'
          operation:
            $ref: '#/components/schemas/type_v1_audit_PlatformActionOperation'
          resourceKind:
            $ref: '#/components/schemas/type_v1_audit_ResourceKind'
        required:
        - type
        - operation
      discriminator:
        propertyName: type
      title: Action
    type_v1_audit_User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/type_v1_audit_UserId'
        name:
          type: string
        email:
          type: string
        externalId:
          $ref: '#/components/schemas/type_v1_audit_ExternalUserId'
      required:
      - id
      - name
      title: User
    type_v1_audit_AuditEvent:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/type_v1_audit_AuditEventId'
        tenantId:
          $ref: '#/components/schemas/type_v1_audit_TenantId'
        timestamp:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/type_v1_audit_Actor'
        action:
          $ref: '#/components/schemas/type_v1_audit_Action'
        resource:
          $ref: '#/components/schemas/type_v1_audit_Resource'
        context:
          $ref: '#/components/schemas/type_v1_audit_Context'
        status:
          $ref: '#/components/schemas/type_v1_audit_AuditEventStatus'
      required:
      - id
      - tenantId
      - timestamp
      - actor
      - action
      - context
      - status
      title: AuditEvent
    type_v1_issues_IssueId:
      type: string
      description: The unique identifier for an issue in Method
      title: IssueId
    type_v1_audit_ExternalUserId:
      type: string
      description: The identifier of a user in Method according to an external auth provider
      title: ExternalUserId
    type_v1_audit_AuditEventId:
      type: string
      description: The unique identifier for an audit event in Method
      title: AuditEventId
    type_v1_audit_TenantId:
      type: string
      description: The unique identifier of the tenant for which the audit event was emitted
      title: TenantId
    type_v1_audit_UserAgent:
      type: string
      description: The user agent for a request made to the Method platform
      title: UserAgent
    type_v1_audit_GetAuditEventsRequest:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
      required:
      - startTime
      - endTime
      title: GetAuditEventsRequest
    type_v1_audit_AuditEventStatus:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - success
            description: 'Discriminator value: success'
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - failure
            description: 'Discriminator value: failure'
          message:
            type: string
        required:
        - type
      discriminator:
        propertyName: type
      title: AuditEventStatus
    type_v1_audit_AuditEventsResponse:
      type: object
      properties:
        auditEvents:
          type: array
          items:
            $ref: '#/components/schemas/type_v1_audit_AuditEvent'
        pagingToken:
          type: string
      required:
      - auditEvents
      title: AuditEventsResponse
    type_v1_audit_PlatformActionOperation:
      type: string
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOAD
      - QUERY
      - DECRYPT
      title: PlatformActionOperation
    type_v1_audit_GroupId:
      type: string
      description: The unique identifier of a user group in Method
      title: GroupId
  securitySchemes:
    client-credentials:
      type: http
      scheme: bearer
