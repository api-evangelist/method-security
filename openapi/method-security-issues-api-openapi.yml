openapi: 3.2.0
info:
  title: Reference Issues API
  version: 1.0.0
tags:
- name: Issues
paths:
  /method-api-gateway/api/v1/issues/{id}:
    get:
      operationId: issues_getIssue
      summary: Get Issue
      description: Retrieve an issue from Method using its ID
      tags:
      - Issues
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/v1_issues_IssueId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_issues_Issue'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1_issues_IssueId'
      security:
      - client-credentials: []
components:
  schemas:
    v1_issues_IssueStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
      - ARCHIVED
      title: IssueStatus
    v1_issues_IssueId:
      type: string
      description: The unique identifier for an issue in Method
      title: IssueId
    v1_objects_ObjectId:
      type: string
      description: The unique identifier for an object in Method
      title: ObjectId
    v1_issues_IssueSeverity:
      type: string
      enum:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      - INFO
      title: IssueSeverity
    v1_issues_ValidationStatus:
      type: string
      enum:
      - VALIDATED
      - INVALIDATED
      title: ValidationStatus
    common_EnvironmentId:
      type: string
      description: The unique identifier for an environment in Method
      title: EnvironmentId
    v1_issues_IssueClosedReason:
      type: string
      enum:
      - RESOLVED
      - CLOSED_BY_AGENT
      - ACCEPTED_RISK
      - FALSE_POSITIVE
      - NOT_APPLICABLE
      title: IssueClosedReason
    v1_issues_Issue:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/v1_issues_IssueId'
        issueDetailsLink:
          type: string
        environmentId:
          $ref: '#/components/schemas/common_EnvironmentId'
        environmentName:
          type: string
        description:
          type: string
        remediation:
          type: string
        status:
          $ref: '#/components/schemas/v1_issues_IssueStatus'
        severity:
          $ref: '#/components/schemas/v1_issues_IssueSeverity'
        closedReason:
          $ref: '#/components/schemas/v1_issues_IssueClosedReason'
        affectedObjectId:
          $ref: '#/components/schemas/v1_objects_ObjectId'
        affectedObjectTitle:
          type: string
        affectedObjectDetailsLink:
          type: string
        validationStatus:
          $ref: '#/components/schemas/v1_issues_ValidationStatus'
      required:
      - id
      - issueDetailsLink
      - environmentId
      - environmentName
      - description
      - remediation
      - status
      - severity
      - affectedObjectId
      - affectedObjectTitle
      - affectedObjectDetailsLink
      title: Issue
  securitySchemes:
    client-credentials:
      type: http
      scheme: bearer
