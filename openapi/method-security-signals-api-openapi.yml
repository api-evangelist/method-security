openapi: 3.1.0
info:
  title: API Reference audit signals API
  version: 1.0.0
tags:
- name: signals
paths:
  /method-api-gateway/api/v1/signals/{signalId}/content:
    get:
      operationId: getSignalContentServer
      summary: Get Signal Content Server
      description: Retrieve the raw content for a signal using its ID.
      tags:
      - signals
      parameters:
      - name: signalId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_v1/signals:SignalId'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                description: Any type
components:
  securitySchemes:
    client-credentials:
      type: http
      scheme: bearer
