openapi: 3.2.0
info:
  title: Reference Targets API
  version: 1.0.0
tags:
- name: Targets
paths:
  /method-api-gateway/api/v2/targets/search:
    post:
      operationId: targets_searchTargets
      summary: Search Targets
      description: Search targeting runs with an optional filter.
      tags:
      - Targets
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_targets_SearchTargetsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2_targets_SearchTargetsRequest'
      security:
      - client-credentials: []
  /method-api-gateway/api/v2/targets/{targetId}:
    get:
      operationId: targets_getTarget
      summary: Get Target
      description: Retrieve a targeting run by ID.
      tags:
      - Targets
      parameters:
      - name: targetId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/common_TargetId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_targets_Target'
      security:
      - client-credentials: []
  /method-api-gateway/api/v2/targets/{targetId}/reports:
    get:
      operationId: targets_getTargetReports
      summary: Get Target Reports
      description: Retrieve reports linked to a targeting run.
      tags:
      - Targets
      parameters:
      - name: targetId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/common_TargetId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_targets_GetTargetReportsResponse'
      security:
      - client-credentials: []
  /method-api-gateway/api/v2/targets/{targetId}/findings:
    get:
      operationId: targets_getTargetFindings
      summary: Get Target Findings
      description: Retrieve finding IDs linked to this targeting run.
      tags:
      - Targets
      parameters:
      - name: targetId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/common_TargetId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_targets_GetTargetFindingsResponse'
      security:
      - client-credentials: []
components:
  schemas:
    v2_targets_TargetStage:
      type: string
      enum:
      - TARGETED
      - RESEARCHED
      - VULNERABLE
      - COMPROMISED
      - REMEDIATED
      description: Funnel stage of a targeting run. These names match the Targeting UI (Targeted, Researched, Vulnerable, Compromised, Remediated).
      title: TargetStage
    v2_targets_TargetStatus:
      type: string
      enum:
      - AWAITING_APPROVAL
      - IN_PROGRESS
      - FINISHED
      - INVALIDATED
      - BLOCKED
      - EXHAUSTED
      - DEFERRED
      title: TargetStatus
    v2_targets_GetTargetFindingsResponse:
      type: object
      properties:
        findingIds:
          type: array
          items:
            $ref: '#/components/schemas/common_FindingId'
      required:
      - findingIds
      title: GetTargetFindingsResponse
    v2_targets_TargetFilter:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - andFilter
            description: 'Discriminator value: andFilter'
          filters:
            type: array
            items:
              $ref: '#/components/schemas/v2_targets_TargetFilter'
        required:
        - type
        - filters
      - type: object
        properties:
          type:
            type: string
            enum:
            - orFilter
            description: 'Discriminator value: orFilter'
          filters:
            type: array
            items:
              $ref: '#/components/schemas/v2_targets_TargetFilter'
        required:
        - type
        - filters
      - type: object
        properties:
          type:
            type: string
            enum:
            - notFilter
            description: 'Discriminator value: notFilter'
          filter:
            $ref: '#/components/schemas/v2_targets_TargetFilter'
        required:
        - type
        - filter
      - type: object
        properties:
          type:
            type: string
            enum:
            - idFilter
            description: 'Discriminator value: idFilter'
          id:
            $ref: '#/components/schemas/common_TargetId'
        required:
        - type
        - id
      - type: object
        properties:
          type:
            type: string
            enum:
            - stage
            description: 'Discriminator value: stage'
          stage:
            $ref: '#/components/schemas/v2_targets_TargetStage'
        required:
        - type
        - stage
      - type: object
        properties:
          type:
            type: string
            enum:
            - status
            description: 'Discriminator value: status'
          status:
            $ref: '#/components/schemas/v2_targets_TargetStatus'
        required:
        - type
        - status
      - type: object
        properties:
          type:
            type: string
            enum:
            - nameLike
            description: 'Discriminator value: nameLike'
          value:
            type: string
        required:
        - type
        - value
      - type: object
        properties:
          type:
            type: string
            enum:
            - createdAtAfter
            description: 'Discriminator value: createdAtAfter'
          createdAt:
            type: string
            format: date-time
        required:
        - type
        - createdAt
      - type: object
        properties:
          type:
            type: string
            enum:
            - createdAtBefore
            description: 'Discriminator value: createdAtBefore'
          createdAt:
            type: string
            format: date-time
        required:
        - type
        - createdAt
      - type: object
        properties:
          type:
            type: string
            enum:
            - updatedAtAfter
            description: 'Discriminator value: updatedAtAfter'
          updatedAt:
            type: string
            format: date-time
        required:
        - type
        - updatedAt
      - type: object
        properties:
          type:
            type: string
            enum:
            - updatedAtBefore
            description: 'Discriminator value: updatedAtBefore'
          updatedAt:
            type: string
            format: date-time
        required:
        - type
        - updatedAt
      - type: object
        properties:
          type:
            type: string
            enum:
            - environment
            description: 'Discriminator value: environment'
          environmentId:
            $ref: '#/components/schemas/common_EnvironmentId'
        required:
        - type
        - environmentId
      - type: object
        properties:
          type:
            type: string
            enum:
            - enabled
            description: 'Discriminator value: enabled'
          isEnabled:
            type: boolean
        required:
        - type
        - isEnabled
      discriminator:
        propertyName: type
      title: TargetFilter
    v2_targets_Target:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/common_TargetId'
        targetDetailsLink:
          type: string
        targetedAssetName:
          type: string
        targetTypeName:
          type: string
        targetTypeDescription:
          type: string
        name:
          type: string
        description:
          type: string
        environmentId:
          $ref: '#/components/schemas/common_EnvironmentId'
        environmentName:
          type: string
        environmentDetailsLink:
          type: string
        stage:
          $ref: '#/components/schemas/v2_targets_TargetStage'
        status:
          $ref: '#/components/schemas/v2_targets_TargetStatus'
        relatedLinks:
          type: array
          items:
            $ref: '#/components/schemas/v2_targets_TargetRelatedLink'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/v2_targets_TargetReportSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
      required:
      - id
      - targetDetailsLink
      - targetedAssetName
      - targetTypeName
      - targetTypeDescription
      - name
      - description
      - environmentId
      - environmentName
      - environmentDetailsLink
      - stage
      - status
      - relatedLinks
      - reports
      - createdAt
      - updatedAt
      title: Target
    v2_targets_TargetReportSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/v1_reports_ReportId'
        reportDetailsLink:
          type: string
      required:
      - id
      - reportDetailsLink
      description: A report linked to a targeting run.
      title: TargetReportSummary
    v2_targets_GetTargetReportsResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/v2_targets_TargetReportSummary'
      required:
      - reports
      title: GetTargetReportsResponse
    v2_targets_SearchTargetsResponse:
      type: object
      properties:
        targets:
          type: array
          items:
            $ref: '#/components/schemas/v2_targets_Target'
        pagingToken:
          type: string
      required:
      - targets
      title: SearchTargetsResponse
    common_FindingId:
      type: string
      description: The unique identifier for a finding. Same RID as an ontology-gateway Issue.
      title: FindingId
    v2_targets_SearchTargetsRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/v2_targets_TargetFilter'
        pagingToken:
          type: string
        pageSize:
          type: integer
      title: SearchTargetsRequest
    v1_reports_ReportId:
      type: string
      description: The unique identifier for a report document.
      title: ReportId
    v2_targets_TargetRelatedLink:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/v2_targets_TargetRelatedLinkKind'
        url:
          type: string
      required:
      - kind
      - url
      description: A platform URL for a resource related to a targeting run.
      title: TargetRelatedLink
    common_EnvironmentId:
      type: string
      description: The unique identifier for an environment in Method
      title: EnvironmentId
    v2_targets_TargetRelatedLinkKind:
      type: string
      enum:
      - ISSUE
      - OBJECT
      - OBJECT_SET
      - OPERATOR_SESSION
      - OVERWATCH_SESSION
      - AGENT_SESSION
      title: TargetRelatedLinkKind
    common_TargetId:
      type: string
      description: The unique identifier for a targeting run.
      title: TargetId
  securitySchemes:
    client-credentials:
      type: http
      scheme: bearer
