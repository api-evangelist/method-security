openapi: 3.2.0
info:
  title: Reference Targets API
  version: 1.0.0
tags:
- name: Targets
paths:
  /method-api-gateway/api/v1/targets/search:
    post:
      operationId: searchTargets
      summary: Search Targets
      description: Search targeting runs with an optional filter.
      tags:
      - Targets
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1_targets_SearchTargetsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_v1_targets_SearchTargetsRequest'
  /method-api-gateway/api/v1/targets/{targetId}:
    get:
      operationId: getTarget
      summary: Get Target
      description: Retrieve a targeting run by ID.
      tags:
      - Targets
      parameters:
      - name: targetId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_v1_targets_TargetId'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1_targets_Target'
  /method-api-gateway/api/v1/targets/{targetId}/reports:
    get:
      operationId: getTargetReports
      summary: Get Target Reports
      description: Retrieve reports linked to a targeting run.
      tags:
      - Targets
      parameters:
      - name: targetId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_v1_targets_TargetId'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_v1_targets_GetTargetReportsResponse'
components:
  schemas:
    type_v1_targets_TargetReportSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/type_v1_reports_ReportId'
        reportDetailsLink:
          type: string
      required:
      - id
      - reportDetailsLink
      description: A report linked to a targeting run.
      title: TargetReportSummary
    type_v1_targets_TargetStage:
      type: string
      enum:
      - TARGETED
      - VALIDATED
      - EXPLOITABLE
      - EXPLOITED
      - REMEDIATED
      - INVALIDATED
      - DEFERRED
      - BLOCKED
      title: TargetStage
    type_v1_reports_ReportId:
      type: string
      description: The unique identifier for a report document.
      title: ReportId
    type_v1_targets_TargetId:
      type: string
      description: The unique identifier for a targeting run.
      title: TargetId
    type_v1_targets_SearchTargetsRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/type_v1_targets_TargetFilter'
        pagingToken:
          type: string
        pageSize:
          type: integer
      title: SearchTargetsRequest
    type_v1_targets_TargetRelatedLinkKind:
      type: string
      enum:
      - ISSUE
      - OBJECT
      - OBJECT_SET
      - OPERATOR_SESSION
      - OVERWATCH_SESSION
      - AGENT_SESSION
      title: TargetRelatedLinkKind
    type_v1_targets_TargetStatus:
      type: string
      enum:
      - AWAITING_APPROVAL
      - IN_PROGRESS
      - FINISHED
      title: TargetStatus
    type_common_EnvironmentId:
      type: string
      description: The unique identifier for an environment in Method
      title: EnvironmentId
    type_v1_targets_Target:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/type_v1_targets_TargetId'
        targetDetailsLink:
          type: string
        targetedAssetName:
          type: string
        targetTypeName:
          type: string
        targetTypeDescription:
          type: string
        name:
          type: string
        description:
          type: string
        environmentId:
          $ref: '#/components/schemas/type_common_EnvironmentId'
        environmentName:
          type: string
        environmentDetailsLink:
          type: string
        stage:
          $ref: '#/components/schemas/type_v1_targets_TargetStage'
        status:
          $ref: '#/components/schemas/type_v1_targets_TargetStatus'
        relatedLinks:
          type: array
          items:
            $ref: '#/components/schemas/type_v1_targets_TargetRelatedLink'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/type_v1_targets_TargetReportSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
      required:
      - id
      - targetDetailsLink
      - targetedAssetName
      - targetTypeName
      - targetTypeDescription
      - name
      - description
      - environmentId
      - environmentName
      - environmentDetailsLink
      - stage
      - status
      - relatedLinks
      - reports
      - createdAt
      - updatedAt
      title: Target
    type_v1_targets_TargetRelatedLink:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/type_v1_targets_TargetRelatedLinkKind'
        url:
          type: string
      required:
      - kind
      - url
      description: A platform URL for a resource related to a targeting run.
      title: TargetRelatedLink
    type_v1_targets_GetTargetReportsResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/type_v1_targets_TargetReportSummary'
      required:
      - reports
      title: GetTargetReportsResponse
    type_v1_targets_TargetFilter:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - andFilter
            description: 'Discriminator value: andFilter'
          filters:
            type: array
            items:
              $ref: '#/components/schemas/type_v1_targets_TargetFilter'
        required:
        - type
        - filters
      - type: object
        properties:
          type:
            type: string
            enum:
            - orFilter
            description: 'Discriminator value: orFilter'
          filters:
            type: array
            items:
              $ref: '#/components/schemas/type_v1_targets_TargetFilter'
        required:
        - type
        - filters
      - type: object
        properties:
          type:
            type: string
            enum:
            - notFilter
            description: 'Discriminator value: notFilter'
          filter:
            $ref: '#/components/schemas/type_v1_targets_TargetFilter'
        required:
        - type
        - filter
      - type: object
        properties:
          type:
            type: string
            enum:
            - idFilter
            description: 'Discriminator value: idFilter'
          id:
            $ref: '#/components/schemas/type_v1_targets_TargetId'
        required:
        - type
        - id
      - type: object
        properties:
          type:
            type: string
            enum:
            - stage
            description: 'Discriminator value: stage'
          stage:
            $ref: '#/components/schemas/type_v1_targets_TargetStage'
        required:
        - type
        - stage
      - type: object
        properties:
          type:
            type: string
            enum:
            - status
            description: 'Discriminator value: status'
          status:
            $ref: '#/components/schemas/type_v1_targets_TargetStatus'
        required:
        - type
        - status
      - type: object
        properties:
          type:
            type: string
            enum:
            - nameLike
            description: 'Discriminator value: nameLike'
          value:
            type: string
        required:
        - type
        - value
      - type: object
        properties:
          type:
            type: string
            enum:
            - createdAtAfter
            description: 'Discriminator value: createdAtAfter'
          createdAt:
            type: string
            format: date-time
        required:
        - type
        - createdAt
      - type: object
        properties:
          type:
            type: string
            enum:
            - createdAtBefore
            description: 'Discriminator value: createdAtBefore'
          createdAt:
            type: string
            format: date-time
        required:
        - type
        - createdAt
      - type: object
        properties:
          type:
            type: string
            enum:
            - updatedAtAfter
            description: 'Discriminator value: updatedAtAfter'
          updatedAt:
            type: string
            format: date-time
        required:
        - type
        - updatedAt
      - type: object
        properties:
          type:
            type: string
            enum:
            - updatedAtBefore
            description: 'Discriminator value: updatedAtBefore'
          updatedAt:
            type: string
            format: date-time
        required:
        - type
        - updatedAt
      - type: object
        properties:
          type:
            type: string
            enum:
            - environment
            description: 'Discriminator value: environment'
          environmentId:
            $ref: '#/components/schemas/type_common_EnvironmentId'
        required:
        - type
        - environmentId
      discriminator:
        propertyName: type
      title: TargetFilter
    type_v1_targets_SearchTargetsResponse:
      type: object
      properties:
        targets:
          type: array
          items:
            $ref: '#/components/schemas/type_v1_targets_Target'
        pagingToken:
          type: string
      required:
      - targets
      title: SearchTargetsResponse
  securitySchemes:
    client-credentials:
      type: http
      scheme: bearer
